<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PIVOT PARTY · QR 포스터</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
  :root { --ink: #0d0d10; --accent: #c8ff3d; --pink: #ff4f8b; }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: 'Pretendard', -apple-system, 'Apple SD Gothic Neo', sans-serif; background: #e9e9ee; color: var(--ink); }
  .tools { max-width: 720px; margin: 20px auto; padding: 0 16px; display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  .tools input { flex: 1; min-width: 220px; padding: 10px 12px; border: 1px solid #c9c9d3; border-radius: 10px; font: inherit; font-size: 14px; }
  .tools button { padding: 10px 14px; border: 0; border-radius: 10px; background: var(--ink); color: #fff; font: inherit; font-weight: 700; cursor: pointer; }
  .tools .note { width: 100%; font-size: 12px; color: #666; margin: 0; }

  .poster { width: 210mm; min-height: 297mm; margin: 0 auto 40px; background: var(--ink); color: #fff; padding: 22mm 18mm; display: flex; flex-direction: column; align-items: center; text-align: center; position: relative; overflow: hidden; }
  .poster::before { content: ''; position: absolute; width: 140mm; height: 140mm; border-radius: 50%; background: radial-gradient(circle, rgba(200,255,61,.35), transparent 65%); top: -50mm; right: -50mm; }
  .poster::after { content: ''; position: absolute; width: 140mm; height: 140mm; border-radius: 50%; background: radial-gradient(circle, rgba(255,79,139,.30), transparent 65%); bottom: -60mm; left: -60mm; }
  .poster > * { position: relative; z-index: 1; }
  .kicker { font-family: ui-monospace, Menlo, monospace; letter-spacing: .35em; font-size: 15px; color: var(--accent); }
  .party { font-size: 76px; font-weight: 900; letter-spacing: -.04em; line-height: 1; margin: 6mm 0 2mm; }
  .head { font-size: 40px; font-weight: 900; line-height: 1.2; margin: 6mm 0 10mm; letter-spacing: -.02em; }
  .head em { font-style: normal; color: var(--accent); }
  .qr { background: #fff; padding: 9mm; border-radius: 8mm; box-shadow: 0 0 0 3mm var(--accent); }
  .qr img, .qr canvas { display: block; width: 95mm !important; height: 95mm !important; image-rendering: pixelated; }
  .steps { display: flex; gap: 8mm; margin-top: 14mm; font-size: 19px; font-weight: 700; flex-wrap: wrap; justify-content: center; }
  .steps span b { display: inline-grid; place-items: center; width: 30px; height: 30px; border-radius: 50%; background: var(--accent); color: var(--ink); margin-right: 8px; font-size: 16px; }
  .extra { margin-top: 10mm; font-size: 20px; color: #ffe2b0; white-space: pre-wrap; max-width: 160mm; }
  .url { margin-top: auto; padding-top: 10mm; font-family: ui-monospace, Menlo, monospace; font-size: 12px; color: #8a8a9b; word-break: break-all; }

  @page { size: A4; margin: 0; }
  @media print {
    body { background: none; }
    .tools { display: none; }
    .poster { margin: 0; zoom: 1 !important; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
  }
</style>
</head>
<body>
  <div class="tools">
    <input id="extraInput" placeholder="포스터에 넣을 문구 (예: 1인 1곡 · 새벽 1시까지)">
    <button id="printBtn" type="button">인쇄 / PDF 저장</button>
    <p class="note">QR은 이 사이트의 신청 페이지 주소로 자동으로 만들어져요. 인쇄 창에서 "PDF로 저장"을 고르면 파일로도 받을 수 있어요.</p>
  </div>

  <div class="poster">
    <div class="kicker">SONG REQUEST</div>
    <div class="party" id="party">PIVOT PARTY</div>
    <div class="head">듣고 싶은 노래,<br><em>QR 찍고 신청!</em></div>
    <div class="qr" id="qr"></div>
    <div class="steps">
      <span><b>1</b>카메라로 QR 찍기</span>
      <span><b>2</b>곡 제목 입력</span>
      <span><b>3</b>신청하기 ♥</span>
    </div>
    <div class="extra" id="extra"></div>
    <div class="url" id="url"></div>
  </div>

<script src="config.js"></script>
<script>
(function () {
  const cfg = window.PIVOT_CONFIG || {};
  document.getElementById('party').textContent = cfg.PARTY_NAME || 'PIVOT PARTY';

  // ?url=로 직접 지정 가능, 아니면 같은 폴더의 index.html
  const params = new URLSearchParams(location.search);
  const target = params.get('url') || new URL('index.html', location.href).href.replace(/index\.html$/, '');
  document.getElementById('url').textContent = target;

  if (window.QRCode) {
    new QRCode(document.getElementById('qr'), { text: target, width: 600, height: 600, correctLevel: QRCode.CorrectLevel.M });
  } else {
    document.getElementById('qr').textContent = 'QR 라이브러리를 불러오지 못했어요. 인터넷 연결을 확인해 주세요.';
  }

  const extra = document.getElementById('extra');
  const input = document.getElementById('extraInput');
  try { input.value = localStorage.getItem('pivot_poster_extra') || ''; } catch (e) {}
  const sync = () => { extra.textContent = input.value; try { localStorage.setItem('pivot_poster_extra', input.value); } catch (e) {} };
  input.addEventListener('input', sync);
  sync();
  document.getElementById('printBtn').addEventListener('click', () => window.print());

  // 폰 화면에서는 포스터를 화면 폭에 맞게 축소해서 보여줌 (인쇄는 원래 크기)
  const poster = document.querySelector('.poster');
  const fit = () => { const z = Math.min(1, (window.innerWidth - 16) / 794); poster.style.zoom = z < 1 ? z : ''; };
  window.addEventListener('resize', fit);
  fit();
})();
</script>
</body>
</html>
